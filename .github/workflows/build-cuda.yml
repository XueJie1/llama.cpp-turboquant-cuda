name: Build llama.cpp-turboquant with CUDA

on:
  schedule:
    # Weekly: Mondays at 03:17 UTC (off-round-minute to avoid the herd)
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if this commit was already built'
        required: false
        type: boolean
        default: false

# Source fork we build Linux x86 CUDA binaries from.
env:
  SOURCE_REPO: TheTom/llama-cpp-turboquant
  SOURCE_BRANCH: feature/turboquant-kv-cache
  SOURCE_URL: https://github.com/TheTom/llama-cpp-turboquant.git

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_hash: ${{ steps.check.outputs.release_hash }}
      short_hash: ${{ steps.check.outputs.short_hash }}
      build_date: ${{ steps.check.outputs.build_date }}
      commit_date: ${{ steps.check.outputs.commit_date }}
    steps:
      - name: Checkout (this repo, for tag dedup)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest source commit and build tag
        id: check
        run: |
          set -e
          # Fetch the tip commit of the tracked source branch.
          COMMIT_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${SOURCE_REPO}/commits/${SOURCE_BRANCH}")
          RELEASE_HASH=$(echo "$COMMIT_JSON" | jq -r '.sha')
          COMMIT_DATE=$(echo "$COMMIT_JSON" | jq -r '.commit.committer.date')
          SHORT_HASH=${RELEASE_HASH:0:7}
          # Build date = the day this build runs (compile date, per user request).
          BUILD_DATE=$(date -u +%Y%m%d)
          # Release tag in THIS repo: date + short sha. Date makes it sortable
          # and human-friendly; short sha dedups identical commits across weeks.
          RELEASE_TAG="tqp-cuda-${BUILD_DATE}-${SHORT_HASH}"

          echo "Source repo:   ${SOURCE_REPO}"
          echo "Source branch: ${SOURCE_BRANCH}"
          echo "Commit:        ${RELEASE_HASH}"
          echo "Commit date:   ${COMMIT_DATE}"
          echo "Build date:    ${BUILD_DATE}"
          echo "Release tag:   ${RELEASE_TAG}"

          # Dedup: skip if this exact commit was already built here.
          if git tag | grep -qE "tqp-cuda-[0-9]{8}-${SHORT_HASH}$"; then
            echo "Commit ${SHORT_HASH} already built"
            if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
              echo "Force build enabled, building anyway"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "New commit ${SHORT_HASH}, will build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_hash=${RELEASE_HASH}" >> "$GITHUB_OUTPUT"
          echo "short_hash=${SHORT_HASH}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "commit_date=${COMMIT_DATE}" >> "$GITHUB_OUTPUT"

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { suffix: amd64, runs_on: ubuntu-latest }
        include:
          - cuda_version: '12.8.1'
            cuda_version_short: '12.8'
            cuda_tag: '12.8.1-cudnn-devel-ubuntu22.04'
            # CUDA 12.8 nvcc covers Turing through Blackwell. Same list applies
            # regardless of host arch since compute capability targets the GPU.
            architectures: '75-virtual;80-virtual;86-virtual;89-virtual;90-virtual;100-virtual;120-virtual'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          echo "=== Initial Disk Space ==="
          df -h

          echo "=== Removing unnecessary packages ==="
          sudo apt-get remove -y '^aspnetcore-.*' || true
          sudo apt-get remove -y '^dotnet-.*' --fix-missing || true
          sudo apt-get remove -y '^llvm-.*' --fix-missing || true
          sudo apt-get remove -y 'php.*' --fix-missing || true
          sudo apt-get remove -y '^mongodb-.*' --fix-missing || true
          sudo apt-get remove -y '^mysql-.*' --fix-missing || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true

          echo "=== Removing large directories ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Clean docker system
          docker system prune -af || true

          echo "=== After Cleanup ==="
          df -h

      - name: Build llama.cpp-turboquant with CUDA
        run: |
          # Pull Docker image
          docker pull nvidia/cuda:${{ matrix.cuda_tag }}

          # Run build in container
          docker run --rm \
            -v $PWD:/workspace \
            nvidia/cuda:${{ matrix.cuda_tag }} \
            bash -c "
              set -e

              echo '=== Installing minimal dependencies ==='
              apt-get update -qq
              apt-get install -y --no-install-recommends git cmake ninja-build build-essential libssl-dev ca-certificates
              apt-get clean
              rm -rf /var/lib/apt/lists/*

              echo '=== Cloning llama.cpp-turboquant ==='
              cd /workspace
              # Shallow clone of the tracked branch tip. The tip SHA equals the
              # resolved release_hash, so this checks out exactly that commit.
              git clone --depth 1 --branch ${{ env.SOURCE_BRANCH }} ${{ env.SOURCE_URL }} llama.cpp-turboquant
              cd llama.cpp-turboquant
              echo 'Checked out commit:' \$(git rev-parse HEAD)
              if [ \"\$(git rev-parse HEAD)\" != \"${{ needs.check-release.outputs.release_hash }}\" ]; then
                echo 'WARNING: checked-out HEAD does not match resolved hash (branch moved under us); continuing anyway'
              fi

              echo '=== Configuring build with Ninja ==='
              export LIBRARY_PATH=\"/usr/local/cuda/lib64/stubs\${LIBRARY_PATH:+:\$LIBRARY_PATH}\"

              ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
              cmake -B build -S . \
                -G Ninja \
                -DGGML_CUDA=ON \
                -DCMAKE_CUDA_ARCHITECTURES='${{ matrix.architectures }}' \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DGGML_NATIVE=OFF \
                -DLLAMA_BUILD_TESTS=OFF \
                -DLLAMA_BUILD_EXAMPLES=OFF \
                -DGGML_CUDA_FA_ALL_QUANTS=ON \
                -DCMAKE_EXE_LINKER_FLAGS='-Wl,-rpath-link,/usr/local/cuda/lib64/stubs' \
                -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-rpath-link,/usr/local/cuda/lib64/stubs'

              echo '=== Building with Ninja (parallel: all cores) ==='
              cmake --build build --config Release -j\$(nproc)

              echo '=== Copying binaries ==='
              cd /workspace
              mkdir -p binaries/cuda-${{ matrix.cuda_version_short }}

              # Copy everything from build/bin
              cp -r llama.cpp-turboquant/build/bin/* binaries/cuda-${{ matrix.cuda_version_short }}/

              # Strip binaries to reduce size (executables only, not .so files)
              find binaries/cuda-${{ matrix.cuda_version_short }}/ -type f -executable ! -name \"*.so*\" -exec strip {} \; 2>/dev/null || true

              echo '=== Creating version info ==='
              echo 'project: llama.cpp-turboquant' > binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'source: ${{ env.SOURCE_URL }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'branch: ${{ env.SOURCE_BRANCH }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'commit: ${{ needs.check-release.outputs.release_hash }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'commit_date: ${{ needs.check-release.outputs.commit_date }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'release_tag: ${{ needs.check-release.outputs.release_tag }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'CUDA version: ${{ matrix.cuda_version }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'Architectures: ${{ matrix.architectures }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'Build date: ${{ needs.check-release.outputs.build_date }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt

              echo '=== Build complete ==='
              ls -lh binaries/cuda-${{ matrix.cuda_version_short }}/

              echo '=== Cleaning up build directory ==='
              rm -rf llama.cpp-turboquant
            "

          # Remove Docker image to free space
          docker rmi nvidia/cuda:${{ matrix.cuda_tag }} || true

          # Fix permissions for files created by root in container
          sudo chown -R $(id -u):$(id -g) $PWD

          echo "=== Final disk usage ==="
          df -h

      - name: Create tarball
        run: |
          cd binaries
          tar -czf llama.cpp-turboquant-${{ needs.check-release.outputs.release_tag }}-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch.suffix }}.tar.gz cuda-${{ matrix.cuda_version_short }}
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-turboquant-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch.suffix }}
          path: binaries/*.tar.gz
          retention-days: 1

  release:
    needs: [check-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-release.outputs.release_tag }}
          name: llama.cpp-turboquant ${{ needs.check-release.outputs.release_tag }} (CUDA 12.8)
          body: |
            # llama.cpp-turboquant with CUDA Support

            Weekly Linux x86_64 (amd64) CUDA build of
            [TheTom/llama-cpp-turboquant](https://github.com/TheTom/llama-cpp-turboquant),
            branch `${{ env.SOURCE_BRANCH }}`.

            Built automatically each week when a new commit lands on the tracked
            branch; identical commits are not rebuilt (use the manual
            `workflow_dispatch` run with **Force build** to override).

            **Source:** ${{ env.SOURCE_URL }}
            **Branch:** ${{ env.SOURCE_BRANCH }}
            **Commit:** ${{ needs.check-release.outputs.release_hash }}
            **Commit date:** ${{ needs.check-release.outputs.commit_date }}
            **Build date:** ${{ needs.check-release.outputs.build_date }}

            ## Build details
            - Host arch: x86_64 (amd64), Linux
            - CUDA version: 12.8.1
            - GPU compute capabilities: 7.5, 8.0, 8.6, 8.9, 9.0, 10.0, 12.0
              - 7.5: Tesla T4, RTX 20xx series, Quadro RTX
              - 8.0: A100
              - 8.6: RTX 3000 series
              - 8.9: RTX 4000 series, L4, L40
              - 9.0: H100, H200, GH200
              - 10.0: B200, GB200
              - 12.0: RTX Pro series, RTX 50xx

            ## Usage
            ```bash
            tar -xzf llama.cpp-turboquant-${{ needs.check-release.outputs.release_tag }}-cuda-12.8-amd64.tar.gz
            ./cuda-12.8/llama-cli --help
            ./cuda-12.8/llama-server
            ```
            CUDA runtime is not bundled; install a CUDA 12.8-compatible driver
            on the host (>= 570.x).
          files: release-assets/*
          draft: false
          prerelease: false
